version = 1

; M4 Pro / 24 GB: system is already near capacity from other apps (swap was
; observed in active use with just one model loaded). Only one model resident
; at a time - two resident models pushed the machine into disk swap, which
; wrecked inference speed far worse than any cold-load delay does.
; ctx-size 65536: opencode's own system prompt (~26K tokens) already eats
; most of a 32768 window, leaving little room before long conversations hit
; a hard "exceeds context size" error. Doubling costs almost nothing here -
; the main model (35B-A3B MoE) only needs ~0.67GB more KV cache for it, and
; its n_ctx_train (262144) has room to go much higher than this if ever needed.
[*]
ctx-size = 65536
n-gpu-layers = all
flash-attn = on
cache-type-k = q8_0
cache-type-v = q8_0
parallel = 1
ubatch-size = 1024
load-on-startup = false
sleep-idle-seconds = 900
no-mmproj = true

; [gemma-4-E4B] - cold-loads on demand now that Qwen 27B is opencode's main model
; hf = unsloth/gemma-4-E4B-it-GGUF
; quant = Q4_K_M (already cached)
[unsloth/gemma-4-E4B-it-GGUF:Q4_K_M]

; [qwen-3.5-9B] - opencode's small_model (titles etc). Fast, cold-loads on demand.
; reasoning off: it's a thinking model by default and was burning 100+ hidden
; "thinking" tokens (multiple seconds) just to answer trivially - wrong
; tradeoff for a model whose whole job is being fast, not deep.
; hf = unsloth/Qwen3.5-9B-GGUF
; quant = UD-Q4_K_XL (~6 GB)
; install = llama download -hf unsloth/Qwen3.5-9B-GGUF:UD-Q4_K_XL
[unsloth/Qwen3.5-9B-GGUF:UD-Q4_K_XL]
reasoning = off

; [qwen-3.6-27B-dense] - does NOT fit on this 24 GB Mac (confirmed: loads
; "successfully" per mmap, then fails with a compute error on first real
; request). Kept in the preset in case more RAM ever frees up, but don't set
; it as main/small_model.
; hf = unsloth/Qwen3.6-27B-GGUF
; quant = Q4_K_M (~16.8 GB; best quality tier with safe headroom on 24 GB - in
; theory; not in practice on this machine)
; install = llama download -hf unsloth/Qwen3.6-27B-GGUF:Q4_K_M
[unsloth/Qwen3.6-27B-GGUF:Q4_K_M]

; [qwen-3.6-35B-A3B] - opencode's main model. MoE: 35B total params, only 3B
; active per token, so inference speed matches/beats the 9B dense model
; despite carrying far more knowledge. Confirmed working end-to-end: 8.2 GB
; RSS (comfortable margin, unlike the 27B dense above), correct code output,
; ~53 tok/s generation. MoE also tolerates aggressive quantization (UD-Q2_K_XL)
; much better than a dense model would at the same bit-depth.
; reasoning off: also defaults to thinking mode (burned 142 tokens on a hidden
; trace just to say "hi") - same wasteful pattern as the 9B, same fix.
; hf = unsloth/Qwen3.6-35B-A3B-GGUF
; quant = UD-Q2_K_XL (~12.3 GB)
; install = llama download -hf unsloth/Qwen3.6-35B-A3B-GGUF:UD-Q2_K_XL
[unsloth/Qwen3.6-35B-A3B-GGUF:UD-Q2_K_XL]
load-on-startup = true
reasoning = off
