# herdr-spreader layouts — the herdr equivalent of tmux/scripts/tmux-session-workspace.sh
# Apply with: herdr plugin action invoke herdr-spreader apply
# Preview without touching the session: herdr-spreader apply --dry-run
#
# Same three tabs as the tmux script: term / git (lazygit) / codex.
# Copy a block and change name + root to add a project.

workspaces:
  - name: dotfiles
    root: ~/Projects/personal/dotfiles
    focus: true
    tabs:
      - label: term
        panes:
          - focus: true
      - label: git
        panes:
          - command: lazygit
            env:
              EDITOR: nvim
      - label: codex
        panes:
          - command: codex

