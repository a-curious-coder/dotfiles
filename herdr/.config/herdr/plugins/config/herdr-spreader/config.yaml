# herdr-spreader layouts — the herdr equivalent of tmux/scripts/tmux-session-workspace.sh
# Apply with: prefix+shift+s, or `herdr plugin action invoke apply --plugin herdr-spreader`
# Preview without touching the session: herdr-spreader apply --dry-run
#
# Three tabs: term / git (lazygit) / claude.
# Copy a block and change name + root to add a project.
#
# Every apply creates a NEW workspace — spreader has no reuse/idempotent mode.
# Only fire the keybind when you want a fresh space.

workspaces:
  - name: dotfiles
    root: ~/Projects/personal/dotfiles
    focus: true
    tabs:
      - label: term
        panes:
          - focus: true
      - label: git
        panes:
          - command: lazygit
            env:
              EDITOR: nvim
      - label: claude
        panes:
          - command: claude --allow-dangerously-skip-permissions

